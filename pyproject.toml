[project]
name = "deal-document-intelligence"
version = "0.1.0"
description = "Clause & entity extraction models from deal documents"
authors = [{ name = "Ted Ly", email = "lydongcanh@gmail.com" }]
readme = "README.md"

requires-python = ">=3.13,<3.14"

dependencies = [
    "pydantic==2.13.4",
]

# Consumer-facing extras: install only the capability you need.
#   pip install deal-document-intelligence               → core (contracts + interfaces + pipeline)
#   pip install deal-document-intelligence[classification] → + the trained clause classifier
[project.optional-dependencies]
classification = ["torch==2.13.0", "transformers==4.57.6", "sentencepiece==0.2.2"]

[tool.poetry]
packages = [{ include = "deal_document_intelligence", from = "package" }]

# Heavy training stack — optional so a fresh clone stays light.
# Install with:  poetry install --with training
[tool.poetry.group.training]
optional = true

[tool.poetry.group.training.dependencies]
datasets = "==3.6.0"        # load CUAD / LEDGAR (training data prep only)
huggingface-hub = "==0.36.2"
transformers = "==4.57.6"
torch = "==2.13.0"
evaluate = "==0.4.6"        # standard metric implementations (F1, etc.)
accelerate = "==1.14.0"     # device/precision handling for training loops
seqeval = "==1.2.2"         # the standard metric for token-level NER
sentencepiece = "==0.2.2"   # tokenizer backend for XLM-R / Legal-XLM-R

# Demo / walking-skeleton stack — a CONSUMER of the package, not part of it.
# docling lives here (not in the package) so the library stays vendor-free.
# Install with:  poetry install --with demo
[tool.poetry.group.demo]
optional = true

[tool.poetry.group.demo.dependencies]
docling = "==2.113.0"
lingua-language-detector = "==2.2.0"

# Dev tooling — optional so consumer/core installs stay minimal.
# Install with:  poetry install --with dev
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "==9.1.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
